name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["state/**", "site/**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy check.py add.py dashboard.py
      - run: uv run --frozen pytest -q
