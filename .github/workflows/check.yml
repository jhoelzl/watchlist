name: check

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Nur diese URL prüfen (leer = alle)"
        required: false
        default: ""

permissions: {}

concurrency: watchlist

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # URLs, Snapshots und Verlauf liegen in Supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Chromium installieren (nur wenn js true genutzt wird)
        run: |
          if uv run --frozen --no-dev check.py --needs-js; then
            uv run --frozen --no-dev --extra js playwright install --with-deps chromium
          fi
      - run: uv run --frozen --no-dev --extra js check.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          WATCHLIST_ONLY_URL: ${{ inputs.url }}
      - name: Alarm bei Fehler
        if: failure()
        run: |
          uv run --frozen --no-dev check.py --alert "Der Workflow ist fehlgeschlagen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
