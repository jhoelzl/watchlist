name: check

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions: {}

concurrency: watchlist

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push auf den Branch state
    env:
      WATCHLIST_STATE_DIR: ${{ github.workspace }}/data/state
      WATCHLIST_SITE_DIR: ${{ github.workspace }}/data/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Branch "state" (Snapshots und Dashboard) auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: state
          path: data
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      - name: Chromium installieren (nur wenn js true genutzt wird)
        run: |
          if grep -qE '^\s*js:\s*true' urls.yml; then
            uv run --frozen --no-dev --extra js playwright install --with-deps chromium
          fi
      - run: uv run --frozen --no-dev --extra js check.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
      - name: Snapshots und Dashboard committen
        if: ${{ !cancelled() }}
        working-directory: data
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add state site
          git diff --cached --quiet && exit 0
          git commit -m "Update snapshots"
          for i in 1 2 3; do
            git push origin HEAD:state && exit 0
            git pull --rebase origin state
          done
          exit 1
      - name: Dashboard für Pages vorbereiten
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: data/site
      - name: Alarm bei Fehler
        if: failure()
        run: |
          uv run --frozen --no-dev check.py --alert "Der Workflow ist fehlgeschlagen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}

  pages:
    needs: check
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
