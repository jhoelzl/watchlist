name: check

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Check only this URL, or several separated by newlines (leave blank for all)"
        required: false
        default: ""
      group:
        description: "Check only this group (leave blank for all)"
        required: false
        default: ""
      review_url:
        description: "Compare this configured URL with JavaScript without changing its baseline"
        required: false
        default: ""
      apply_url:
        description: "Adopt a reviewed JavaScript baseline for this URL"
        required: false
        default: ""
      review_key:
        description: "Review key to adopt"
        required: false
        default: ""
      review_time:
        description: "Review timestamp to adopt"
        required: false
        default: ""

permissions: {}

concurrency: watchlist

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read # no longer needed (GitHub Models retired); kept harmless
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # URLs, snapshots, and history are stored in Supabase; credentials come from the "watchlist" 1Password vault
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SUPABASE_URL: op://watchlist/Supabase/url
          SUPABASE_SERVICE_KEY: op://watchlist/Supabase/service-token
          RESEND_API_KEY: op://watchlist/Resend/api-key
          MAIL_TO: op://watchlist/Mail/to
          MAIL_FROM: op://watchlist/Mail/from
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Check whether JavaScript rendering is configured
        id: js
        run: |
          if [ -n "$REVIEW_URL" ] || { [ -z "$APPLY_URL" ] && uv run --frozen --no-dev check.py --needs-js; }; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          REVIEW_URL: ${{ inputs.review_url }}
          APPLY_URL: ${{ inputs.apply_url }}
      - name: Cache Playwright browsers
        if: steps.js.outputs.required == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
      - name: "Install Chromium (only when js: true is used)"
        if: steps.js.outputs.required == 'true'
        run: uv run --frozen --no-dev --extra js playwright install --with-deps chromium
      - run: uv run --frozen --no-dev --extra js check.py
        if: ${{ !inputs.review_url && !inputs.apply_url }}
        env:
          WATCHLIST_ONLY_URL: ${{ inputs.url }}
          WATCHLIST_ONLY_GROUP: ${{ inputs.group }}
          WATCHLIST_SUMMARIES: ${{ vars.WATCHLIST_SUMMARIES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare with JavaScript
        if: ${{ inputs.review_url && !inputs.apply_url }}
        run: uv run --frozen --no-dev --extra js check.py --review-js "$REVIEW_URL"
        env:
          REVIEW_URL: ${{ inputs.review_url }}
      - name: Adopt reviewed JavaScript baseline
        if: ${{ inputs.apply_url && !inputs.review_url }}
        run: uv run --frozen --no-dev check.py --apply-js-review "$APPLY_URL" "$REVIEW_KEY" "$REVIEW_TIME"
        env:
          APPLY_URL: ${{ inputs.apply_url }}
          REVIEW_KEY: ${{ inputs.review_key }}
          REVIEW_TIME: ${{ inputs.review_time }}
      - name: Alert on failure
        if: ${{ failure() && !inputs.review_url && !inputs.apply_url }}
        run: |
          uv run --frozen --no-dev check.py --alert "The workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
