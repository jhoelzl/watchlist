name: check

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Check only this URL (leave blank for all)"
        required: false
        default: ""
      group:
        description: "Check only this group (leave blank for all)"
        required: false
        default: ""

permissions: {}

concurrency: watchlist

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read # AI summaries via GitHub Models (WATCHLIST_SUMMARIES)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # URLs, snapshots, and history are stored in Supabase; credentials come from the "watchlist" 1Password vault
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          SUPABASE_URL: op://watchlist/Supabase/url
          SUPABASE_SERVICE_KEY: op://watchlist/Supabase/service-token
          RESEND_API_KEY: op://watchlist/Resend/api-key
          MAIL_TO: op://watchlist/Mail/to
          MAIL_FROM: op://watchlist/Mail/from
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - name: "Install Chromium (only when js: true is used)"
        run: |
          if uv run --frozen --no-dev check.py --needs-js; then
            uv run --frozen --no-dev --extra js playwright install --with-deps chromium
          fi
      - run: uv run --frozen --no-dev --extra js check.py
        env:
          WATCHLIST_ONLY_URL: ${{ inputs.url }}
          WATCHLIST_ONLY_GROUP: ${{ inputs.group }}
          WATCHLIST_SUMMARIES: ${{ vars.WATCHLIST_SUMMARIES }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Alert on failure
        if: failure()
        run: |
          uv run --frozen --no-dev check.py --alert "The workflow failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
