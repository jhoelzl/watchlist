name: check

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: watchlist

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.1
        with:
          enable-cache: true
      - name: Chromium installieren (nur wenn js true genutzt wird)
        run: |
          if grep -qE '^\s*js:\s*true' urls.yml; then
            uv run --frozen --no-dev --extra js playwright install --with-deps chromium
          fi
      - run: uv run --frozen --no-dev --extra js check.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
      - name: Snapshots und Dashboard committen
        run: |
          git config user.name "watchlist-bot"
          git config user.email "watchlist-bot@users.noreply.github.com"
          git add state site
          git diff --cached --quiet || git commit -m "Update snapshots"
          git push
      - name: Dashboard für Pages vorbereiten
        if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Alarm bei Fehler
        if: failure()
        run: |
          uv run --frozen --no-dev check.py --alert "Der Workflow ist fehlgeschlagen: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}

  pages:
    needs: check
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
