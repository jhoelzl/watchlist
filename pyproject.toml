[project]
name = "watchlist"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0.3",
    "regex>=2026.9.29",
    "requests>=2.34.2",
]

[project.optional-dependencies]
js = [
    "playwright>=1.64.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
    "types-regex>=2026.9.29.20261017",
    "types-requests>=2.33.0.20261006",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH"]
ignore = ["E741"]  # `l` is intentional here for lines

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811"]  # Fixtures are imported

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = true
warn_unused_configs = true
warn_unused_ignores = true
