# defaults apply to all URLs (ignore lists are merged; other options are overridden).
# Optionen pro URL:
#   name:       Display name (defaults to the page title)
#   group:      Group for email and dashboard (default: General)
#   selector:   CSS selector; only this area is monitored
#   ignore:     List of regex patterns removed before comparison
#   only_added: true = email shows only new lines (default for RSS/Atom feeds)
#   js:         true = render the page with Playwright (for JavaScript-loaded content)
#   min_ratio:  Text guard, default 0.3 (0 = off)
#   ignore_robots: true = bypass robots.txt restrictions
# Add a URL: uv run add.py <url>
defaults:
  ignore:
    - 'Last updated on\s*\S+'

urls:
  - url: https://example.com/blog
    name: Example Blog
    group: Examples
    selector: main
  - url: https://example.com/feed.xml
    group: Examples
