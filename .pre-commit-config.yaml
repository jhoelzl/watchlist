# Einmalig aktivieren: uv run pre-commit install
# Alle Dateien prüfen: uv run pre-commit run --all-files
# Die Hooks nutzen die in uv.lock fixierten Versionen (gleich wie CI).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy check.py add.py dashboard.py store.py migrate.py
        language: system
        types: [python]
        pass_filenames: false
      - id: web-lint
        name: web oxlint
        entry: npm --prefix web run lint
        language: system
        files: ^web/src/
        pass_filenames: false
      - id: web-tsc
        name: web tsc
        entry: bash -c 'cd web && npx tsc -b'
        language: system
        files: ^web/(src/|tsconfig.*|package.*)
        pass_filenames: false
