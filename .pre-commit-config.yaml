# Einmalig aktivieren: uv run pre-commit install (installiert pre-commit- und pre-push-Hook)
# Alle Dateien prüfen: uv run pre-commit run --all-files
# Die Hooks nutzen die in uv.lock fixierten Versionen (gleich wie CI).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        name: kein Commit/Push direkt auf main (Branch + PR verwenden)
        args: [--branch, main]
        stages: [pre-commit, pre-push]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run --frozen ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy check.py add.py store.py migrate.py
        language: system
        types: [python]
        pass_filenames: false
      - id: web-lint
        name: web oxlint
        entry: npm --prefix web run lint
        language: system
        files: ^web/src/
        pass_filenames: false
      - id: web-tsc
        name: web tsc
        entry: bash -c 'cd web && npx tsc -b'
        language: system
        files: ^web/(src/|tsconfig.*|package.*)
        pass_filenames: false
